name: Check

on:
  push:

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubicloud-standard-8
    timeout-minutes: 5
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install Infisical CLI
        run: |
          curl -fsSL -o /tmp/infisical.tar.gz https://github.com/Infisical/cli/releases/download/v0.43.114/cli_0.43.114_linux_amd64.tar.gz
          tar -xzf /tmp/infisical.tar.gz -C /tmp infisical
          sudo mv /tmp/infisical /usr/local/bin/infisical
          infisical --version
      - name: Authenticate with Infisical
        run: |
          JWT=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/jahands" | jq -r .value)
          INFISICAL_TOKEN=$(infisical login --method=oidc-auth --machine-identity-id=$INFISICAL_IDENTITY_ID --jwt="$JWT" --plain --silent)
          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: '0.20.6'
      - name: Check & Test (Dagger)
        run: ./.dagger/bin/daggerx test

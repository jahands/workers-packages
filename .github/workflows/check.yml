name: Check

on:
  push:

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubicloud-standard-8
    timeout-minutes: 5
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install Infisical CLI
        run: |
          curl -fsSL -o /tmp/infisical.tar.gz https://github.com/Infisical/cli/releases/download/v0.43.114/cli_0.43.114_linux_amd64.tar.gz
          tar -xzf /tmp/infisical.tar.gz -C /tmp infisical
          sudo mv /tmp/infisical /usr/local/bin/infisical
          infisical --version
      - name: Authenticate with Infisical
        uses: Infisical/auth-action@v1.0.0
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/jahands
          output-env-credential: true
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: '0.20.6'
      - name: Check & Test (Dagger)
        run: ./.dagger/bin/daggerx test
